version: "3.9"

services:
  marius-ebook-stack-studio:
    build: .
    image: kimmingil/marius-ebook-stack:latest
    container_name: marius-ebook-stack-studio
    hostname: marius-ebook-stack-studio
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORT:-8500}:8500"
    environment:
      TZ: "${TZ:-Asia/Seoul}"
      PORT: "8500"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8500/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure:5
