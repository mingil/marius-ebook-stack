# =============================================================================
# 🏆 MARIUS HOSTING STYLE - ULTIMATE SYNOLOGY EBOOK & MANGA STACK (v1.0.0)
# =============================================================================
# • 프로젝트명   : marius-ebook-stack (기존 ebook-library 완벽 진단·교정·확장판)
# • 작성 스타일  : Marius Bogdan Lixandru (mariushosting.com) 표준 규격 100% 준수
# • 시놀로지 권한: PUID=1026 / PGID=100 / TZ=Asia/Seoul
# • 설정 경로    : /volume1/docker/<서비스명> (순수 Config & DB 전용으로 완벽 분리)
# • 마스터 서재  : /volume1/data/ebooks:/data:rw (전 컨테이너 단일 볼륨 공유 & 하드링크 지원)
# =============================================================================

version: "3.9"

# 🌐 1. 도커 내부 통신용 브리지 네트워크 (기존 ebook_net 및 호스트네임 100% 호환)
networks:
  marius-ebook-net:
    name: marius-ebook-net
    driver: bridge

# 🧹 2. 시놀로지 NAS 디스크 보호용 공통 로그 로테이션 설정
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # 📚 1. KOMGA - 만화·웹툰·매거진 메인 미디어 서버 (G1GC 메모리 최적화)
  # ---------------------------------------------------------------------------
  komga:
    image: gotson/komga:latest
    container_name: ebook-komga
    hostname: komga
    networks:
      marius-ebook-net:
        aliases:
          - komga
          - ebook-komga
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      JAVA_TOOL_OPTIONS: "-Xmx3g -XX:+UseG1GC -XX:+UseStringDeduplication"
      SERVER_PORT: 25600
    ports:
      - "8341:25600"
    volumes:
      - /volume1/docker/komga/config:/config:rw
      - /volume1/data/ebooks:/data:rw
      - /volume1/docker/komga/data:/legacy-komga-data:rw
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:25600/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 🌟 2. KAVITA - 라이트노벨(EPUB)·소설·만화 초고속 하이브리드 서버
  # ---------------------------------------------------------------------------
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: ebook-kavita
    hostname: kavita
    networks:
      marius-ebook-net:
        aliases:
          - kavita
          - ebook-kavita
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      DOTNET_GCHeapHardLimit: 0xC0000000
    ports:
      - "5471:5000"
    volumes:
      - /volume1/docker/kavita/config:/kavita/config:rw
      - /volume1/data/ebooks:/data:rw
      - /volume1/data/ebooks/manga:/manga:rw
      - /volume1/data/ebooks/lightnovels:/lightnovels:rw
      - /volume1/data/ebooks/books:/books:rw
      - /volume1/docker/kavita/data:/legacy-kavita-manga:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 🎧 3. AUDIOBOOKSHELF - 오디오북·팟캐스트·전자책 스트리밍 서버
  # ---------------------------------------------------------------------------
  audiobookshelf:
    image: advplyr/audiobookshelf:latest
    container_name: ebook-audiobookshelf
    hostname: audiobookshelf
    networks:
      marius-ebook-net:
        aliases:
          - audiobookshelf
          - ebook-audiobookshelf
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      CONFIG_PATH: /config
      METADATA_PATH: /metadata
      PORT: 80
    ports:
      - "13378:80"
    volumes:
      # ✅ [핵심 수정 완료] 기존 상위 폴더(/volume1/docker/audiobookshelf) 중첩 마운트 버그를 /config 하위 분리로 해결
      - /volume1/docker/audiobookshelf/config:/config:rw
      - /volume1/docker/audiobookshelf/metadata:/metadata:rw
      - /volume1/data/ebooks/audiobooks:/audiobooks:rw
      - /volume1/data/ebooks/podcasts:/podcasts:rw
      - /volume1/data/ebooks/books:/books:rw
      - /volume1/data/ebooks/lightnovels:/lightnovels:rw
      - /volume1/docker/audiobookshelf/audiobooks:/legacy-audiobooks:rw
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || wget -q --spider http://127.0.0.1:80/ping || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 🤖 4. KOMF - Komga & Kavita 만화·웹툰·라노벨 메타데이터 자동 수집 엔진
  # ---------------------------------------------------------------------------
  komf:
    image: sndxr/komf:latest
    container_name: ebook-komf
    hostname: komf
    networks:
      marius-ebook-net:
        aliases:
          - komf
          - ebook-komf
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      KOMF_KOMGA_BASE_URI: http://komga:25600
      KOMF_KOMGA_USER: ${KOMGA_USER}
      KOMF_KOMGA_PASSWORD: ${KOMGA_PASSWORD}
      KOMF_KAVITA_BASE_URI: http://kavita:5000
      KOMF_KAVITA_API_KEY: ${KAVITA_API_KEY}
      KOMF_LOG_LEVEL: INFO
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+UnlockExperimentalVMOptions -XX:+UseShenandoahGC -XX:ShenandoahGCHeuristics=compact -XX:ShenandoahGuaranteedGCInterval=3600000 -XX:TrimNativeHeapInterval=3600000"
    ports:
      - "8085:8085"
    volumes:
      - /volume1/docker/komf/config:/config:rw
    depends_on:
      komga:
        condition: service_healthy
      kavita:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8085 || wget -q --spider http://127.0.0.1:8085 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 📖 5. CALIBRE-WEB-AUTOMATED - 전자책 자동 변환(EPUB/KEPUB) & Kobo/Kindle 서버
  # ---------------------------------------------------------------------------
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: ebook-calibre-web
    hostname: calibre-web-automated
    networks:
      marius-ebook-net:
        aliases:
          - calibre-web-automated
          - ebook-calibre-web
    mem_limit: 2g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      HARDCOVER_TOKEN: ${HARDCOVER_TOKEN:-}
    ports:
      - "8083:8083"
    volumes:
      - /volume1/docker/calibre-web-automated/config:/config:rw
      - /volume1/data/ebooks/cwa-ingest:/cwa-book-ingest:rw
      - /volume1/data/ebooks/calibre-library:/calibre-library:rw
      - /volume1/data/ebooks/books:/books:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 🔍 6. CWA BOOK DOWNLOADER - 웹 도서 검색 & 원클릭 자동 다운로드 포털
  # ---------------------------------------------------------------------------
  cwa-book-downloader:
    image: ghcr.io/calibre-web-automated-book-downloader/calibre-web-automated-book-downloader:latest
    container_name: ebook-book-downloader
    hostname: cwa-book-downloader
    networks:
      marius-ebook-net:
        aliases:
          - cwa-book-downloader
          - ebook-book-downloader
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Seoul}
      UID: ${PUID:-1026}
      GID: ${PGID:-100}
      FLASK_PORT: 8084
      INGEST_DIR: /cwa-book-ingest
      BOOK_LANGUAGE: ko,en,ja
      USE_CF_BYPASS: "true"
    ports:
      - "8084:8084"
    volumes:
      - /volume1/data/ebooks/cwa-ingest:/cwa-book-ingest:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084 >/dev/null || nc -z 127.0.0.1 8084 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 📲 7. SUWAYOMI-SERVER (Tachidesk) - 연재 만화·웹툰 자동 다운로드 서버
  # ---------------------------------------------------------------------------
  suwayomi:
    image: ghcr.io/suwayomi/tachidesk:latest
    container_name: ebook-suwayomi
    hostname: suwayomi
    networks:
      marius-ebook-net:
        aliases:
          - suwayomi
          - ebook-suwayomi
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      BIND_IP: 0.0.0.0
      BIND_PORT: 4567
      DOWNLOAD_AS_CBZ: "true"
      AUTO_DOWNLOAD_CHAPTERS: "true"
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://flaresolverr:8191
    ports:
      - "4567:4567"
    volumes:
      - /volume1/docker/suwayomi:/home/suwayomi/.local/share/Tachidesk:rw
      - /volume1/data/ebooks/manga:/home/suwayomi/.local/share/Tachidesk/downloads:rw
      - /volume1/data/ebooks:/data:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4567 >/dev/null || nc -z 127.0.0.1 4567 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure:5
    logging: *default-logging
